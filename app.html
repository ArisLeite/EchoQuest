<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <title>📜EchoQuest⚔️</title>
</head>

<body>

    <header>
        <h1>📜EchoQuest⚔️</h1>
    </header>

    <main>

        <aside>

            <button>
                <span class="Icon">🧙🏻‍♂</span>
                <br>
                <span class="Text">Adventurer Profile</span>
            </button>

            <button>
                <span class="Icon">💰</span>
                <br>
                <span class="Text">Achievements</span>
            </button>

            <button>
                <span class="Icon">🪶</span>
                <br>
                <span class="Text">Journey</span>
            </button>

            <button>
                <span class="Icon">🎯</span>
                <br>
                <span class="Text">Quests</span>
            </button>

            <button>
                <span class="Icon">⏳</span>
                <br>
                <span class="Text">Focus Session</span>
            </button>

            <button>
                <span class="Icon">🪕</span>
                <br>
                <span class="Text">Soundscapes</span>
            </button>

            <button>
                <span class="Icon">🛠️</span>
                <br>
                <span class="Text">Settings</span>
            </button>

        </aside>

        <section>
            <h2>Welcome!</h2>
        </section>

    </main>

    <footer>

        <div class="Avatar">
            <P>Avatar</P>
            <img>
        </div>

        <div class="Level">
            <p>Level 1</p>
        </div>

        <div class="XP Points">
            <p>XP 000</p>
        </div>

        <div class="XP Progress">
            <progress></progress>
        </div>

    </footer>

</body>
